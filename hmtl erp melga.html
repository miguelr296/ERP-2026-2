<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ROMA ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="login-card">
        <header class="header">
            <div class="logo-placeholder">R</div>
            <div class="brand-info">
                <span class="brand-name">ROMA</span>
                <span class="brand-sub">ERP Empresarial</span>
            </div>
        </header>

        <h1 class="form-title">Iniciar sesión</h1>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Usuario / correo</label>
                <input type="email" id="username" class="form-input" placeholder="admin@roma.pe" required>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••" required>
            </div>

            <label class="checkbox-group">
                <input type="checkbox" id="remember" class="checkbox-input">
                <span class="checkbox-label">Recordarme</span>
            </label>

            <button type="submit" class="btn-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Ingresar
            </button>
        </form>

        <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
        <p class="footer-text">Acceso al sistema empresarial ROMA</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
