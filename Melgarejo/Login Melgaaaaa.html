<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ROMA ERP</title>
    
    <!-- Fuente moderna para interfaces corporativas -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- VARIABLES DE COLOR --- */
        :root {
            --bg-page: #eef2f6;        /* Fondo gris-azulado claro */
            --card-bg: #ffffff;
            --top-border: #3c546b;     /* Borde superior oscuro */
            --text-dark: #1e293b;
            --text-label: #0f172a;
            --text-muted: #94a3b8;
            --brand-blue: #0f3a61;     /* Color principal de la marca */
            --brand-orange: #f97316;   /* Color secundario */
            --btn-bg: #3c7283;         /* Botón teal/pizarra */
            --btn-hover: #2d5663;
            --input-border: #cbd5e1;
            --link-color: #3b82f6;
        }

        /* --- RESET BÁSICO --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        /* --- CONTENEDOR DE LA TARJETA --- */
        .login-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
            border-top: 6px solid var(--top-border);
            padding: 2.5rem;
            margin: 1rem;
        }

        /* --- CABECERA / LOGO --- */
        .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .logo-placeholder {
            width: 50px;
            height: 50px;
            background-color: #f1f5f9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            border: 1px solid #e2e8f0;
            font-weight: bold;
            color: var(--brand-blue);
        }

        .brand-info {
            display: flex;
            flex-direction: column;
        }

        .brand-name {
            color: var(--brand-blue);
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.5px;
        }

        .brand-sub {
            color: var(--brand-orange);
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* --- TÍTULO DEL FORMULARIO --- */
        .form-title {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            color: var(--text-dark);
        }

        /* --- GRUPOS DE INPUTS --- */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-label);
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            border: 1px solid var(--input-border);
            border-radius: 4px;
            outline: none;
            transition: all 0.2s ease;
            color: var(--text-dark);
        }

        .form-input::placeholder {
            color: #cbd5e1;
        }

        .form-input:focus {
            border-color: var(--btn-bg);
            box-shadow: 0 0 0 3px rgba(60, 114, 131, 0.15);
        }

        /* --- CHECKBOX --- */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }

        .checkbox-input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--top-border);
        }

        .checkbox-label {
            font-size: 0.9rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* --- BOTÓN --- */
        .btn-submit {
            width: 100%;
            background-color: var(--btn-bg);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            padding: 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--btn-hover);
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* --- ENLACES Y FOOTER --- */
        .forgot-link {
            display: inline-block;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--link-color);
            text-decoration: none;
            transition: text-decoration 0.2s;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <main class="login-card">
        
        <!-- Cabecera de Logo -->
        <header class="header">
            <!-- Espacio para tu imagen/logo real. He puesto una "R" como placeholder temporal -->
            <div class="logo-placeholder">
                R
            </div>
            <div class="brand-info">
                <span class="brand-name">ROMA</span>
                <span class="brand-sub">ERP Empresarial</span>
            </div>
        </header>

        <h1 class="form-title">Iniciar sesión</h1>

        <form id="loginForm">
            <!-- Campo Usuario -->
            <div class="form-group">
                <label for="username" class="form-label">Usuario / correo</label>
                <input type="email" id="username" class="form-input" placeholder="admin@roma.pe" required>
            </div>

            <!-- Campo Contraseña -->
            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" id="password" class="form-input" placeholder="••••••" required>
            </div>

            <!-- Recordarme -->
            <label class="checkbox-group">
                <input type="checkbox" id="remember" class="checkbox-input">
                <span class="checkbox-label">Recordarme</span>
            </label>

            <!-- Botón de Ingreso -->
            <button type="submit" class="btn-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Ingresar
            </button>
        </form>

        <!-- Pie de tarjeta -->
        <a href="#" class="forgot-link">¿Olvidó su contraseña?</a>
        <p class="footer-text">Acceso al sistema empresarial ROMA</p>

    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.querySelector('.btn-submit');
            const originalText = btn.innerHTML;
            
            btn.innerHTML = 'Verificando...';
            btn.style.opacity = '0.8';
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                console.log('Intento de login enviado.');
            }, 1000);
        });
    </script>

</body>
</html>
