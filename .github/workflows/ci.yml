name: Validación .NET

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Compilar y probar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obtener código
        uses: actions/checkout@v5

      - name: Instalar SDK de global.json
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Mostrar SDK seleccionado
        run: dotnet --version

      - name: Restaurar dependencias
        run: dotnet restore Erp.slnx

      - name: Compilar
        run: dotnet build Erp.slnx --configuration Release --no-restore

      - name: Ejecutar pruebas
        id: pruebas
        run: dotnet test Erp.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults

      - name: Comprobar cantidad y resultado de pruebas
        if: ${{ !cancelled() && (steps.pruebas.outcome == 'success' || steps.pruebas.outcome == 'failure') }}
        run: |
          $archivos = @(Get-ChildItem TestResults -Filter *.trx -Recurse -ErrorAction SilentlyContinue)
          if ($archivos.Count -eq 0) { throw 'No se generaron resultados de pruebas.' }
          $total = 0
          $ejecutadas = 0
          $superadas = 0
          $fallidas = 0
          foreach ($archivo in $archivos) {
            [xml]$resultado = Get-Content -LiteralPath $archivo.FullName -Raw
            $contadores = $resultado.TestRun.ResultSummary.Counters
            $total += [int]$contadores.total
            $ejecutadas += [int]$contadores.executed
            $superadas += [int]$contadores.passed
            $fallidas += [int]$contadores.failed
          }
          $omitidas = $total - $ejecutadas
          Write-Output "Total: $total; ejecutadas: $ejecutadas; superadas: $superadas; fallidas: $fallidas; omitidas: $omitidas"
          if ($ejecutadas -eq 0) { throw 'Debe ejecutarse al menos una prueba real.' }
          if ($fallidas -gt 0) { throw 'Hay pruebas fallidas.' }

      - name: Conservar resultados de pruebas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: resultados-pruebas
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 7
